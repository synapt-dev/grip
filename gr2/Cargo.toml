[package]
name = "gr2-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
# NOT `gr2`. The package publishes no binary, and the user-facing `gr2` command is the
# PYTHON console script (gr2/pyproject.toml `[project.scripts]`). Naming this dev binary
# `gr2` meant a developer with `target/release` on PATH silently got the Rust one instead
# -- two implementations answering to one command name, with nothing checking either.
# src/main.rs's own header already says "development binary, not shipped".
name = "gr2-dev"
path = "src/main.rs"

[lib]
name = "gr2_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
