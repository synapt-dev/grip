name: CI

on:
  workflow_call:
  push:
    branches: [main, dev, "release/*"]
  pull_request:
    branches: [main, dev, "release/*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  boundary-lint:
    name: Boundary Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block forbidden identity markers in OSS surfaces
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_PATHS=(
            src
            tests
            .github
            benches
          )

          PATTERNS=(
            'workspace\.toml'
            'agent\.toml'
            'repo\.toml'
            'g2_'
          )

          failed=0
          for pattern in "${PATTERNS[@]}"; do
            if rg -n --hidden \
              --glob '!*.md' \
              --glob '!*.json' \
              --glob '!CHANGELOG*' \
              --glob '!.github/workflows/ci.yml' \
              "$pattern" "${SEARCH_PATHS[@]}"; then
              echo
              echo "Boundary lint violation: found forbidden marker pattern '$pattern' in OSS surfaces."
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo
            echo "Boundary violation detected. Move identity or workspace-resolution behavior out of OSS."
            exit 1
          fi

          echo "Boundary lint passed."

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          # Allow certain lints that are common in the codebase
          # TODO: Fix these and remove the allows
          cargo clippy --all-features -- \
            -A clippy::ptr_arg \
            -A clippy::too_many_arguments \
            -A clippy::if_same_then_else \
            -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # --no-fail-fast so ONE run surfaces every failing test binary. Without
        # it cargo stops at the first failing binary, and a later binary's
        # failure is invisible until the earlier one is fixed and the run
        # repeated — which is exactly how a Windows-only fixture bug hid a second
        # same-class bug in a binary that never ran (grip promote ci-green).
        run: cargo test --all-features --no-fail-fast

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    # Bounded so a hang reports as a FAILURE WITH A LOG rather than running to
    # the 6-hour default. This leg hung three times on 2026-07-27 (91 min, then
    # 26, then 26 again) and every diagnosis was blocked on never seeing where it
    # stopped -- a hang is worse than a failure precisely because it is
    # indistinguishable from "still running". See grip#821.
    # Raised 15->30 on 2026-09-05: 15 was set against a ~8 min WARM baseline, but a
    # COLD-cache run cancelled the 1.4.0 promotion at 15m05s with every step green
    # (runner luck, not a hang). 30 keeps the hang guard well clear of a cold run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compilation is split out from execution ON PURPOSE. `cargo test` does
      # both, so a single step sitting "in_progress" cannot tell a slow Windows
      # compile apart from a hung test -- which is the exact question three
      # investigations could not answer. With the split, the step breakdown
      # alone discriminates: if "Build tests" completes and "Run tests" hangs,
      # it is a test; if "Build tests" hangs, it is the toolchain.
      # The second invocation reuses the first's artifacts, so this costs a
      # dependency check, not a rebuild.
      - name: Build tests
        run: cargo test --all-features --no-run
        env:
          RUSTFLAGS: '-C link-arg=advapi32.lib -C link-arg=/STACK:8388608'

      - name: Run tests
        # --no-fail-fast: see the matrix job's note. On Windows especially, one
        # run must surface every failing binary rather than stopping at the first.
        run: cargo test --all-features --no-fail-fast
        env:
          RUSTFLAGS: '-C link-arg=advapi32.lib -C link-arg=/STACK:8388608'

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Check binary size
        run: |
          ls -lh target/release/gr
          ls -lh target/release/gitgrip

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --no-run

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Build
        run: cargo build

      - name: Setup mock gripspace
        run: |
          mkdir -p .gitgrip
          cp tests/fixtures/agents.example.toml .gitgrip/agents.toml

      - name: Run spawn integration tests
        run: GR=./target/debug/gr ./tests/spawn_graceful_shutdown.sh

  gr2_python:
    name: gr2 Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in gr2/pyproject.toml's requires-python;
        # test it explicitly rather than only whatever the runner defaults to,
        # or a floor regression can pass CI while silently no longer installing
        # for real 3.11 users (see grip#788's own class of masked failure).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install gr2 (fresh install, no cache)
        working-directory: gr2
        run: python -m pip install -e ".[dev]" --no-cache-dir

      - name: Run gr2 test suite
        working-directory: gr2
        run: python -m pytest

      # Runs AFTER pytest on purpose: pytest populates __pycache__, so the
      # working-tree scan for a .pyc whose source .py is gone has something to
      # find. The tracked-.pyc half is meaningful on any checkout. The release
      # feasibility read found two review tests existing ONLY as stale .pyc with
      # no source; this keeps that class from returning. Default scan-root is the
      # repo toplevel, so it covers the whole tree regardless of this job's cwd.
      - name: No source-less .pyc
        run: ./scripts/check-no-orphan-pyc.sh

  # Summary job for branch protection - requires all jobs except Windows to pass.
  # test-windows runs separately (it is significantly slower) but DOES gate:
  # the aggregate runs under `if: always()`, so a job only fails this check if
  # it is named in the conditional chain below. `needs` alone never fails it.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [boundary-lint, check, fmt, clippy, test, test-windows, build, bench, integration, gr2_python]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.boundary-lint.result }}" != "success" ]] || \
             [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-windows.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.bench.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.gr2_python.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
