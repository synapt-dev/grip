[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
# One product name across both indexes: `cargo install gitgrip` gives `gr`,
# `uv tool install --pre gitgrip` gives `gr2` (the console script below). The import
# package is `gr2`; `gr2_overlay` survives only as a deprecated compat shim.
name = "gitgrip"
# gr2 versions independently of the Rust crate: the Python distribution owns this
# number and it is not derived from Cargo.toml. gr1 releases as crates.io/GitHub
# `v1.x.y`; gr2 releases as PyPI `gr2/v2.x.y`. Runtime reads it via
# importlib.metadata.version("gitgrip"), never a checked-in file.
version = "2.0.0a7"
description = "Workspace layer for multi-repo work: workspaces, isolated lanes, and one grouped review per slice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "tomli_w>=1.0",
    "pyyaml>=6.0",
    "toml>=0.10",
    # Draft 2020-12 validation of the pinned MaterializationPlan v1 schema.
    # 4.18 is the first release with the modern referencing
    # stack; anything older silently falls back to a legacy resolver.
    "jsonschema>=4.18",
]

[project.scripts]
gr2 = "gr2.python_cli.app:main"
git-review = "gr2.python_cli.git_review:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # Declared rather than borrowed: `tests/test_deprecation_registry.py` asks
    # "what PEP 440 stage is this version" and parses with `packaging.version`,
    # which pytest happens to pull in transitively. An import that arrives by
    # accident is one a future pytest could take away.
    "packaging>=22",
]

[tool.setuptools]
# The overlay subsystem is `gr2.overlay` (physically gr2/overlay). `gr2_overlay`
# is a deprecated top-level compat shim that aliases every submodule through
# sys.modules to the real gr2.overlay object.
#
# ITS REMOVAL MILESTONE IS `beta`. It is recorded in `api/deprecations.toml`, and
# deliberately NOT restated here: this line used to say "it is removed in the
# release after 1.5.0", and the distribution had already reached 2.0.0a5 -- the
# deadline passed with nothing going red, because a version written in a comment
# is not compared against anything. The registry is the ONE place a milestone
# lives, and `tests/test_deprecation_registry.py` is what compares it.
packages = ["gr2", "gr2.python_cli", "gr2.prototypes", "gr2.overlay", "gr2_overlay"]

[tool.setuptools.package-dir]
# Every gr2 subpackage lives physically under gr2/gr2/ (overlay, python_cli,
# prototypes), so the directory name equals the import name and nothing here maps a flat
# directory onto a dotted one. The gr2_overlay shim maps to its own top-level dir by default.
gr2 = "gr2"

[tool.setuptools.package-data]
# The pinned MaterializationPlan v1 schema ships inside the
# gr2 package -- spec_apply verifies its bytes against the pinned SHA-256
# at load and fails closed on any mismatch.
# PLATFORM_ADAPTER_CHANGELOG.md ships too, so an out-of-tree adapter author can read the protocol's changes
# from the installed package (tests/test_platform_adapter_changelog.py keeps it in step with the protocol).
gr2 = ["schemas/*.json", "schemas/*/*.proto", "schemas/*/*.pb", "PLATFORM_ADAPTER_CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "gr2/overlay/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
