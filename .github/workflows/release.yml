name: Release

# Two release lines share this one workflow, keyed by tag pattern (one file so the
# PyPI trusted-publisher binding — repo + workflow filename + environment — stays
# intact; a second workflow file would break it):
#   * gr1 (the Rust crate)   — tags  v1.x.y     -> GitHub binaries + crates.io only
#   * gr2 (the Python dist)  — tags  gr2/v2.x.y -> GitHub wheel + PyPI only
# `v*` matches only names beginning with `v`, so it never matches `gr2/v*`; the two
# halves are disjoint. Every job carries `needs: ci`, so no publish runs on red CI.
on:
  push:
    tags:
      - 'v*'
      - 'gr2/v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ---- gr1 (Rust crate): v1.x.y -> binaries + crates.io ----------------------
  build:
    name: Build (${{ matrix.target }})
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          # NOTE: aarch64-linux disabled - OpenSSL cross-compilation issues
          # NOTE: x86_64-apple-darwin disabled - macOS 15 runners are Apple Silicon only
          # TODO: Re-enable with vendored OpenSSL
          # macOS - only Apple Silicon available natively
          - target: aarch64-apple-darwin
            os: macos-latest    # Apple Silicon runner (aarch64)
            name: macos-aarch64
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../gitgrip-${{ matrix.name }}.tar.gz gr gitgrip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../gitgrip-${{ matrix.name }}.zip gr.exe gitgrip.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitgrip-${{ matrix.name }}
          path: gitgrip-${{ matrix.name }}.*

  release-gr1:
    name: Create Release (gr1)
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;
          cat */*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: gitgrip v${{ steps.version.outputs.version }}
          body: |
            ## Installation

            ### Download Binary

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | [gitgrip-linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gitgrip-linux-x86_64.tar.gz) |
            | macOS | aarch64 (Apple Silicon) | [gitgrip-macos-aarch64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gitgrip-macos-aarch64.tar.gz) |
            | Windows | x86_64 | [gitgrip-windows-x86_64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gitgrip-windows-x86_64.zip) |

            > **Note:** Intel Mac users can install via `cargo install gitgrip` or use Rosetta 2 with the Apple Silicon binary.

            ### From crates.io

            ```bash
            cargo install gitgrip
            ```

            `cargo install gitgrip` provides the `gr` CLI. The Python workspace CLI
            (`gr2`) ships separately on PyPI under the `gr2/vX.Y.Z` tags.

            ### Verify Checksums

            ```bash
            sha256sum -c gitgrip-*.sha256
            ```
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    # Needs `release-gr1` so a failed release cannot leave an irreversible crates.io
    # publish behind it (they ran in parallel before this line).
    needs: [ci, build, release-gr1]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # ---- gr2 (Python dist): gr2/v2.x.y -> wheel + PyPI -------------------------
  build-wheel:
    name: Build Python wheel (gr2)
    needs: ci
    if: startsWith(github.ref, 'refs/tags/gr2/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The gr2 distribution owns its version (static in gr2/pyproject.toml), so the
      # wheel version is independent of the Rust crate. Both sdist and wheel are built.
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist gr2

      - name: Assert wheel version equals the tag (PEP 440 normalized)
        run: |
          python -m pip install --quiet packaging
          # gr2 tags are gr2/vX.Y.Z, so strip the gr2/v prefix to get the version.
          TAG="${GITHUB_REF#refs/tags/gr2/v}"
          python - "$TAG" <<'PY'
          import glob, re, sys
          from packaging.version import Version
          tag = Version(sys.argv[1])
          whls = glob.glob("dist/gitgrip-*-py3-none-any.whl")
          assert len(whls) == 1, f"expected one wheel, got {whls}"
          built = Version(re.match(r"dist/gitgrip-(.+?)-py3-none-any\.whl", whls[0]).group(1))
          # Version equality is PEP 440 normalized, so a pre-release tag (gr2/v2.0.0a1)
          # matches the wheel's normalized form (2.0.0a1) rather than the raw tag text.
          assert built == tag, f"wheel {built} != tag {tag}"
          print(f"wheel {built} == tag {tag}")
          PY

      - name: Upload Python dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  release-gr2:
    name: Create Release (gr2)
    needs: [ci, build-wheel]
    if: startsWith(github.ref, 'refs/tags/gr2/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/gr2/v}" >> $GITHUB_OUTPUT

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;
          cat *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: gitgrip (gr2) v${{ steps.version.outputs.version }}
          body: |
            ## gr2 — the Python workspace CLI

            ### From PyPI

            ```bash
            pipx install gitgrip   # or: pip install gitgrip
            ```

            `pip install gitgrip` provides the `gr2` CLI. The Rust CLI (`gr`) ships
            separately on crates.io and GitHub under the `vX.Y.Z` tags.

            ### Verify Checksums

            ```bash
            sha256sum -c gitgrip-*.sha256
            ```
          files: |
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    # Needs `release-gr2` too: a PyPI upload is irreversible (a version can never be
    # re-uploaded), so it must not run if the release job failed.
    needs: [ci, build-wheel, release-gr2]
    if: startsWith(github.ref, 'refs/tags/gr2/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no token secret. Requires a one-time PyPI
    # trusted-publisher configuration for the `gitgrip` project bound to this
    # repo + workflow + environment; until that exists this job errors and the
    # release/attach jobs are unaffected (they do not need it).
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI (trusted publishing)
        # release/v1 is PyPA's maintained major-version ref (their documented
        # entrypoint). Pinning to a full commit SHA is a reasonable further
        # hardening for this irreversible-publish step — deferred to a follow-on
        # that can resolve the current SHA rather than guess it here.
        uses: pypa/gh-action-pypi-publish@release/v1
