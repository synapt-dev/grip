name: CI

on:
  workflow_call:
  push:
    branches: [main, dev, "release/*"]
  pull_request:
    branches: [main, dev, "release/*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  boundary-lint:
    name: Boundary Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block forbidden identity markers in OSS surfaces
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_PATHS=(
            src
            tests
            .github
            benches
          )

          PATTERNS=(
            'workspace\.toml'
            'agent\.toml'
            'repo\.toml'
            'g2_'
          )

          failed=0
          for pattern in "${PATTERNS[@]}"; do
            if rg -n --hidden \
              --glob '!*.md' \
              --glob '!*.json' \
              --glob '!CHANGELOG*' \
              --glob '!.github/workflows/ci.yml' \
              "$pattern" "${SEARCH_PATHS[@]}"; then
              echo
              echo "Boundary lint violation: found forbidden marker pattern '$pattern' in OSS surfaces."
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo
            echo "Boundary violation detected. Move identity or workspace-resolution behavior out of OSS."
            exit 1
          fi

          echo "Boundary lint passed."

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        # --workspace is load-bearing. The root Cargo.toml is a NON-VIRTUAL
        # workspace root ([package] gitgrip and [workspace] members = ["gr2"] in
        # one file), and for that shape a bare cargo command selects the ROOT
        # PACKAGE only; `members` is what only --workspace widens to. Measured
        # 2026-09-30: `cargo metadata` reports workspace_members =
        # [gr2-cli, gitgrip] but workspace_default_members = [gitgrip], and no
        # Rust job in this file compiled the gr2 crate at all.
        run: cargo check --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          # Allow certain lints that are common in the codebase
          # TODO: Fix these and remove the allows
          cargo clippy --workspace --all-features -- \
            -A clippy::ptr_arg \
            -A clippy::too_many_arguments \
            -A clippy::if_same_then_else \
            -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # --no-fail-fast so ONE run surfaces every failing test binary. Without
        # it cargo stops at the first failing binary, and a later binary's
        # failure is invisible until the earlier one is fixed and the run
        # repeated — which is exactly how a Windows-only fixture bug hid a second
        # same-class bug in a binary that never ran (grip promote ci-green).
        run: cargo test --workspace --all-features --no-fail-fast

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    # Bounded so a hang reports as a FAILURE WITH A LOG rather than running to
    # the 6-hour default. This leg hung three times on 2026-07-27 (91 min, then
    # 26, then 26 again) and every diagnosis was blocked on never seeing where it
    # stopped -- a hang is worse than a failure precisely because it is
    # indistinguishable from "still running". See grip#821.
    # Raised 15->30 on 2026-09-05: 15 was set against a ~8 min WARM baseline, but a
    # COLD-cache run cancelled the 1.4.0 promotion at 15m05s with every step green
    # (runner luck, not a hang). 30 keeps the hang guard well clear of a cold run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compilation is split out from execution ON PURPOSE. `cargo test` does
      # both, so a single step sitting "in_progress" cannot tell a slow Windows
      # compile apart from a hung test -- which is the exact question three
      # investigations could not answer. With the split, the step breakdown
      # alone discriminates: if "Build tests" completes and "Run tests" hangs,
      # it is a test; if "Build tests" hangs, it is the toolchain.
      # The second invocation reuses the first's artifacts, so this costs a
      # dependency check, not a rebuild.
      - name: Build tests
        run: cargo test --workspace --all-features --no-run
        env:
          RUSTFLAGS: '-C link-arg=advapi32.lib -C link-arg=/STACK:8388608'

      - name: Run tests
        # --no-fail-fast: see the matrix job's note. On Windows especially, one
        # run must surface every failing binary rather than stopping at the first.
        run: cargo test --workspace --all-features --no-fail-fast
        env:
          RUSTFLAGS: '-C link-arg=advapi32.lib -C link-arg=/STACK:8388608'

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Check binary size
        run: |
          ls -lh target/release/gr
          ls -lh target/release/gitgrip

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --no-run

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Build
        run: cargo build

      - name: Setup mock gripspace
        run: |
          mkdir -p .gitgrip
          cp tests/fixtures/agents.example.toml .gitgrip/agents.toml

      - name: Run spawn integration tests
        run: GR=./target/debug/gr ./tests/spawn_graceful_shutdown.sh

  gr2_python:
    name: gr2 Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in gr2/pyproject.toml's requires-python;
        # test it explicitly rather than only whatever the runner defaults to,
        # or a floor regression can pass CI while silently no longer installing
        # for real 3.11 users (see grip#788's own class of masked failure).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install gr2 (fresh install, no cache)
        working-directory: gr2
        run: python -m pip install -e ".[dev]" --no-cache-dir

      - name: Run gr2 test suite
        working-directory: gr2
        run: python -m pytest

      # Runs AFTER pytest on purpose: pytest populates __pycache__, so the
      # working-tree scan for a .pyc whose source .py is gone has something to
      # find. The tracked-.pyc half is meaningful on any checkout. The release
      # feasibility read found two review tests existing ONLY as stale .pyc with
      # no source; this keeps that class from returning. Default scan-root is the
      # repo toplevel, so it covers the whole tree regardless of this job's cwd.
      - name: No source-less .pyc
        run: ./scripts/check-no-orphan-pyc.sh

      # The guard's witness. It shipped without one (its own commit added the
      # script and the step above, and no test), so every branch in it was
      # asserted only by someone having run it by hand. Runs unconditionally and
      # before nothing in particular: it builds its own fixture in a temp dir, so
      # it neither needs pytest nor a populated __pycache__ in this tree.
      - name: No source-less .pyc (witness)
        run: ./scripts/check-no-orphan-pyc-selftest.sh

      # REPORTS, CANNOT FAIL THE BUILD. gr2 has shipped a committed [tool.ruff]
      # config (E, F, I, UP; py311; line-length 100) with nothing executing it:
      # fmt and clippy cover Rust, and boundary-lint's SEARCH_PATHS is
      # [src, tests, .github, benches], which is gr1's tree. Measured on dev
      # c25d489, CI-shaped (working-directory: gr2; `ruff check .`; ruff 0.16.8):
      # 1266 findings over 147 files -- E501 893, I001 150, UP045 81, F401 54,
      # F841 20; 16 rule codes, 332 carrying a fix. So it reports rather than
      # gates: a required check carrying 1266 findings would red every PR in the
      # repo from its first push. Promote it by deleting continue-on-error.
      #
      # THE INVOCATION IS LOAD-BEARING AND NOT INTERCHANGEABLE. The same tree
      # reports 1277 findings over 174 files when invoked from the repo root as
      # `ruff check gr2 --config gr2/pyproject.toml`; the 11-finding difference is
      # entirely I001, because isort's project-root inference moves import
      # classification. This step is the CI shape, and 1266 is its number.
      #
      # The version is printed WITH the count on purpose: this installs the
      # `ruff>=0.4` floor gr2 already declares, not a pin, so a later ruff can
      # move the number -- and a report that names its own instrument makes that
      # drift visible instead of silent.
      #
      # One matrix entry only: the result does not depend on the interpreter
      # (target-version is pinned to py311 in the config), so a second identical
      # run would print a second identical number with nothing to distinguish it.
      #
      # THE FAILURE PATH IS SPELLED OUT BECAUSE A REPORT THAT SILENTLY DOES NOT RUN
      # IS THE DEFECT THIS JOB EXISTS TO SURFACE. Four ways it can go quiet, each
      # closed here, and the first two were LIVE in earlier versions of this step:
      #   * ruff not importable at all. `python -m ruff --version` as a bare first
      #     line sits OUTSIDE any capture, so under `bash -e` the step aborted on it
      #     and exited with NOTHING printed of its own -- continue-on-error kept the
      #     aggregate green, so the outcome was a green run containing no report.
      #     The version call is now inside the same capture and its output is
      #     interpolated into an echo that always runs.
      #   * ruff exits non-zero on something that is not findings. The rc is captured
      #     without a pipe and printed.
      #   * the JSON is absent or unparseable. The open and the parse are both inside
      #     the try, so a missing file and a malformed one take the same branch.
      #   * THE JSON PARSES BUT IS NOT A FINDINGS LIST, which is the drift this
      #     comment anticipates rather than a contrived case: a later ruff wrapping
      #     its output in an object, or renaming a field. Measured on two such
      #     inputs -- `{"findings": []}` printed NOTHING and exited 1 with a
      #     TypeError, and `[{"filename": "x.py"}]` printed a COUNT and then exited 1
      #     with a KeyError. The second is the worse one: a number on stdout in a
      #     failing step. The shape is therefore CHECKED rather than assumed.
      #   * AND ANY OTHER EXCEPTION THE PARSE ARM CAN RAISE. A named pair was tried
      #     first and was WRONG: `json.loads` on deeply-nested input raises
      #     RecursionError, a RuntimeError, which is neither an OSError nor a
      #     ValueError -- so the arm that claimed it could not raise raised, with no
      #     line of its own. The arm now catches Exception. The honest limit, since
      #     this one is a counterexample to a CLAIM rather than a live defect: ruff
      #     cannot emit deeply-nested JSON, so no real run meets it. But a step whose
      #     whole purpose is to SAY WHEN IT DID NOT RUN should not be able to fail,
      #     and catching Exception here costs nothing, because every path through it
      #     ends in the same honest output either way.
      # **CI green does not mean this report ran; the NO REPORT line is what says it
      # did not.**
      - name: ruff report (not gated)
        if: matrix.python-version == '3.11'
        working-directory: gr2
        continue-on-error: true
        run: |
          set +e
          echo "ruff version: $(python -m ruff --version 2>&1 | head -1)"
          python -m ruff check . --output-format json > "$RUNNER_TEMP/ruff.json"
          rc=$?
          set -e
          echo "ruff exit code: $rc"
          python - "$RUNNER_TEMP/ruff.json" "$rc" <<'PY'
          import collections, json, sys
          path, rc = sys.argv[1], sys.argv[2]
          # Exception, not a named pair. json.JSONDecodeError is a ValueError, so a
          # pair covers a missing file, a malformed one and a wrong-shaped one -- but
          # NOT RecursionError, which is a RuntimeError and which json.loads raises on
          # deeply-nested input. Every path through this arm ends in the same honest
          # output, so there is nothing a narrow class buys.
          try:
              with open(path, encoding="utf-8", errors="replace") as fh:
                  report = json.loads(fh.read())
              if not isinstance(report, list):
                  raise ValueError(f"top level is {type(report).__name__}, not a list")
              for finding in report:
                  if (not isinstance(finding, dict)
                          or not isinstance(finding.get("code"), str)
                          or not isinstance(finding.get("filename"), str)):
                      raise ValueError("an entry is not an object with string 'code' and 'filename'")
          except Exception as exc:
              print(f"NO REPORT: ruff's output is not a findings list "
                    f"(ruff exit {rc}, {type(exc).__name__}: {exc}).")
              print("This step reports and cannot fail the aggregate, so a green run")
              print("does NOT mean the number above is current -- this line says so.")
              sys.exit(0)
          files = {d["filename"] for d in report}
          print(f"gr2 ruff: {len(report)} findings over {len(files)} files")
          for code, n in collections.Counter(d["code"] for d in report).most_common(8):
              print(f"  {code:8} {n}")
          print(f"  fixable: {sum(1 for d in report if d.get('fix'))}")
          print("not gated: this step reports and cannot fail the aggregate")
          PY

  # Summary job for branch protection - every job in the chain below must pass,
  # Windows included. test-windows runs separately because it is significantly
  # slower, and that separation is about cost, not about gating:
  # the aggregate runs under `if: always()`, so a job only fails this check if
  # it is named in the conditional chain below. `needs` alone never fails it.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [boundary-lint, check, fmt, clippy, test, test-windows, build, bench, integration, gr2_python]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.boundary-lint.result }}" != "success" ]] || \
             [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-windows.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.bench.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.gr2_python.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
